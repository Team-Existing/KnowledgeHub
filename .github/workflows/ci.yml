name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      arcadedb:
        image: arcadedata/arcadedb:26.9.1
        env:
          JAVA_OPTS: -Darcadedb.server.rootPassword=ci-password
        ports: ["2480:2480"]
        options: >-
          --health-cmd "wget -q -O /dev/null http://localhost:2480/api/v1/ready || exit 1"
          --health-interval 10s --health-timeout 5s --health-retries 12
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 6
    env:
      KH_TEST_ARCADEDB_URL: http://localhost:2480
      KH_TEST_ARCADEDB_PASSWORD: ci-password
      KH_TEST_REDIS_URL: redis://localhost:6379/15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies
        run: |
          # CPU-only PyTorch, as in the Docker image (the default wheel bundles CUDA)
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -r requirements-dev.txt
      - name: Run tests
        run: pytest

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Run tests
        run: npm test -- --watch=false --browsers=ChromeHeadless
      - name: Build
        run: npm run build

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate Compose files
        run: |
          docker compose config --quiet
          # the production stack refuses to start without its secrets; give it placeholders to validate
          SECRET_KEY=x ARCADEDB_ROOT_PASSWORD=x ARCADEDB_APP_PASSWORD=x REDIS_PASSWORD=x \
            docker compose -f deploy/docker-compose.yml config --quiet
      - name: Build the local stack's images
        run: docker compose build
